name: Build Windows Bridge

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - "main"
    tags:
      - "bridge-v*"

permissions:
  contents: read

concurrency:
  group: crimesim-bridge-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Prepare private Godot runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GODOT_VERSION
          $runtime = "src-tauri/resources/godot"
          $temp = Join-Path $env:RUNNER_TEMP "crimesim-godot"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Get-ChildItem $runtime -Filter "Godot*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item -Recurse -Force (Join-Path $runtime "editor_data") -ErrorAction SilentlyContinue
          Remove-Item -Force (Join-Path $runtime "runtime_manifest.json") -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $temp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $godotUrl = "https://godot-releases.nbg1.your-objectstorage.com/${version}-stable/Godot_v${version}-stable_win64.exe.zip"
          $templatesUrl = "https://godot-releases.nbg1.your-objectstorage.com/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
          $godotZip = Join-Path $temp "godot.zip"
          $templatesZip = Join-Path $temp "templates.zip"

          Invoke-WebRequest -Uri $godotUrl -OutFile $godotZip
          Invoke-WebRequest -Uri $templatesUrl -OutFile $templatesZip
          Expand-Archive -Path $godotZip -DestinationPath (Join-Path $temp "godot") -Force
          Expand-Archive -Path $templatesZip -DestinationPath (Join-Path $temp "templates") -Force

          $godotGui = Get-ChildItem (Join-Path $temp "godot") -Filter "Godot*_win64.exe" -Recurse | Select-Object -First 1
          $godotConsole = Get-ChildItem (Join-Path $temp "godot") -Filter "Godot*_win64_console.exe" -Recurse | Select-Object -First 1
          if (-not $godotGui -or -not $godotConsole) { throw "Godot Windows executable pair not found in official archive" }
          Copy-Item $godotGui.FullName (Join-Path $runtime $godotGui.Name) -Force
          Copy-Item $godotConsole.FullName (Join-Path $runtime $godotConsole.Name) -Force
          New-Item -ItemType File -Force -Path (Join-Path $runtime "_sc_") | Out-Null

          $templateDest = Join-Path $runtime "editor_data/export_templates/${version}.stable"
          New-Item -ItemType Directory -Force -Path $templateDest | Out-Null
          $debugTemplate = Get-ChildItem (Join-Path $temp "templates") -Filter "windows_debug_x86_64.exe" -Recurse | Select-Object -First 1
          $releaseTemplate = Get-ChildItem (Join-Path $temp "templates") -Filter "windows_release_x86_64.exe" -Recurse | Select-Object -First 1
          if (-not $debugTemplate -or -not $releaseTemplate) { throw "Required Windows export templates not found" }
          Copy-Item $debugTemplate.FullName (Join-Path $templateDest "windows_debug_x86_64.exe") -Force
          Copy-Item $releaseTemplate.FullName (Join-Path $templateDest "windows_release_x86_64.exe") -Force

          $manifestFiles = @(
            $godotGui.Name,
            $godotConsole.Name,
            "GODOT_LICENSE.txt",
            "README.txt",
            "editor_data/export_templates/${version}.stable/windows_debug_x86_64.exe",
            "editor_data/export_templates/${version}.stable/windows_release_x86_64.exe"
          )
          $entries = @()
          foreach ($rel in $manifestFiles) {
            $full = Join-Path $runtime $rel
            $entries += @{ path = $rel.Replace("\", "/"); sha256 = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ schema = 1; engine_version = $version; files = $entries } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path (Join-Path $runtime "runtime_manifest.json") -Encoding UTF8

          Write-Host "Runtime prepared. Executable version is checked by the bounded Bridge worker during E2E."

      - name: Validate repository models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/validate_repo.py
          python tools/test_transaction_model.py
          python tools/test_crash_recovery_model.py
          python tools/test_runtime_manifest_model.py
          python tools/test_pipeline_contract.py
          node --check web/app.js
          python tools/test_worker_wiring.py
          python -m unittest discover -s tools/delivery_tests -v

      - name: Compile-check Rust workspace
        run: cargo check --workspace --locked

      - name: Verify scoped game handoffs before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p crimesim-bridge --lib core::context::tests -- --nocapture
          node --test tools/context-ui.test.cjs

      - name: Run real Godot end-to-end Bridge smoke
        shell: pwsh
        env:
          CRIMESIM_BRIDGE_ROOT: ${{ runner.temp }}\crimesim-bridge-e2e
          CRIMESIM_BRIDGE_DOWNLOADS: ${{ runner.temp }}\crimesim-bridge-e2e\downloads
          CRIMESIM_BRIDGE_RUNTIME_SOURCE: ${{ github.workspace }}\src-tauri\resources\godot
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:CRIMESIM_BRIDGE_DOWNLOADS | Out-Null
          cargo run --locked --bin bridge_pipeline_smoke

      - name: Run production safety suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p bridge-safety --features fault-injection
          cargo test --locked -p bridge-worker --features fixture-processes

      - name: Install pinned prebuilt Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tool = Join-Path $env:RUNNER_TEMP 'tauri-cli-2.11.4'
          New-Item -ItemType Directory -Path $tool -Force | Out-Null
          $archive = Join-Path $tool 'cli.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3') { throw 'Tauri CLI archive hash mismatch' }
          Expand-Archive $archive (Join-Path $tool 'bin') -Force
          $cli = @(Get-ChildItem (Join-Path $tool 'bin') -Filter cargo-tauri.exe -Recurse)
          if ($cli.Count -ne 1) { throw 'Expected exactly one Tauri CLI executable' }
          $cli[0].DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Record exact build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $meta | ConvertTo-Json -Depth 30 | Set-Content "$env:RUNNER_TEMP/cargo-metadata.json" -Encoding utf8
          $cliVersion = cargo tauri --version
          if ($cliVersion -notmatch '2\.11\.4') { throw "Tauri CLI version mismatch: $cliVersion" }
          @{
            schema = 1
            source_commit = (git rev-parse HEAD).Trim()
            source_tree = (git rev-parse 'HEAD^{tree}').Trim()
            cargo_lock_sha256 = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            godot_version = $env:GODOT_VERSION
            rust_version = (rustc --version)
            tauri_cli_version = $cliVersion
          } | ConvertTo-Json | Set-Content src-tauri/resources/build_info.json -Encoding utf8
          $bundle = Join-Path $meta.target_directory 'release/bundle/nsis'
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }

      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis -- --locked

      - name: Clean-install and exercise actual desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = python tools/delivery.py discover --metadata "$env:RUNNER_TEMP/cargo-metadata.json"
          ./tools/test_installer.ps1 -InstallerPath $installer -EvidenceDirectory "$env:RUNNER_TEMP/installed-evidence"

      - name: Verify installer and write release manifest
        id: delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/delivery.py manifest --metadata "$env:RUNNER_TEMP/cargo-metadata.json" --report "$env:RUNNER_TEMP/installed-evidence/install_check.json" --provenance src-tauri/resources/build_info.json --lock Cargo.lock --output "$env:RUNNER_TEMP/verified-installer"
          if (-not (Test-Path "$env:RUNNER_TEMP/verified-installer/release_manifest.json")) { throw "Release manifest missing" }
          "directory=$env:RUNNER_TEMP/verified-installer" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CrimeSim-Bridge-Windows-BUILD-1-${{ github.run_number }}
          path: ${{ steps.delivery.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload end-to-end and installed-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrimeSim-Bridge-BUILD-1-Evidence-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/crimesim-bridge-e2e/logs/**
            ${{ runner.temp }}/crimesim-bridge-e2e/state/**
            ${{ runner.temp }}/installed-evidence/**
            ${{ runner.temp }}/cargo-metadata.json
            src-tauri/resources/build_info.json
            Cargo.lock
          if-no-files-found: warn
          retention-days: 30
