name: Build Windows Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Download private Godot runtime and templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GODOT_VERSION
          $runtime = Join-Path $env:RUNNER_TEMP "godot-runtime"
          $download = Join-Path $env:RUNNER_TEMP "godot-download"
          Remove-Item -Recurse -Force $runtime,$download -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtime,$download | Out-Null

          $engineUrl = "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip"
          $templatesUrl = "https://github.com/godotengine/godot-builds/releases/download/$version-stable/Godot_v$version-stable_export_templates.tpz"
          $engineZip = Join-Path $download "godot.zip"
          $templatesZip = Join-Path $download "templates.zip"

          Invoke-WebRequest -Uri $engineUrl -OutFile $engineZip
          Invoke-WebRequest -Uri $templatesUrl -OutFile $templatesZip
          Expand-Archive -Path $engineZip -DestinationPath (Join-Path $download "engine") -Force
          Expand-Archive -Path $templatesZip -DestinationPath (Join-Path $download "templates") -Force

          $engine = Get-ChildItem (Join-Path $download "engine") -Filter "Godot*_win64.exe" -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Godot Windows executable not found" }
          Copy-Item $engine.FullName (Join-Path $runtime "godot.exe")
          New-Item -ItemType File -Path (Join-Path $runtime "_sc_") -Force | Out-Null

          $templateDir = Join-Path $runtime "editor_data/export_templates/$version.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          $debug = Get-ChildItem (Join-Path $download "templates") -Filter "windows_debug_x86_64.exe" -Recurse | Select-Object -First 1
          $release = Get-ChildItem (Join-Path $download "templates") -Filter "windows_release_x86_64.exe" -Recurse | Select-Object -First 1
          if (-not $debug -or -not $release) { throw "Windows export templates not found" }
          Copy-Item $debug.FullName (Join-Path $templateDir "windows_debug_x86_64.exe")
          Copy-Item $release.FullName (Join-Path $templateDir "windows_release_x86_64.exe")

          $reported = & (Join-Path $runtime "godot.exe") --version
          Write-Host "Godot reports: $reported"
          if (-not ($reported -like "$version*")) { throw "Godot version mismatch: $reported" }
          "GODOT_EXE=$(Join-Path $runtime 'godot.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create and export real Godot smoke project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:RUNNER_TEMP "crimesim-godot-smoke"
          $build = Join-Path $project "build"
          New-Item -ItemType Directory -Force -Path $project,$build | Out-Null

          @'
          [application]
          config/name="CrimeSim Pipeline Smoke"
          run/main_scene="res://main.tscn"

          [display]
          window/size/viewport_width=640
          window/size/viewport_height=360

          [rendering]
          renderer/rendering_method="gl_compatibility"
          '@ | Set-Content (Join-Path $project "project.godot") -Encoding utf8

          @'
          extends Node

          func _ready() -> void:
              print("CRIMESIM_GODOT_SMOKE_OK")
              get_tree().quit()
          '@ | Set-Content (Join-Path $project "main.gd") -Encoding utf8

          @'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://main.gd" type="Script" id="1"]

          [node name="Main" type="Node"]
          script = ExtResource("1")
          '@ | Set-Content (Join-Path $project "main.tscn") -Encoding utf8

          @'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]
          binary_format/architecture="x86_64"
          '@ | Set-Content (Join-Path $project "export_presets.cfg") -Encoding utf8

          & $env:GODOT_EXE --headless --path $project --import --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed: $LASTEXITCODE" }

          & $env:GODOT_EXE --headless --path $project --export-debug "Windows Desktop" (Join-Path $build "CrimeSimSmoke.exe")
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $build "CrimeSimSmoke.exe"))) { throw "Exported smoke executable missing" }

          & (Join-Path $build "CrimeSimSmoke.exe") --headless --path $project
          if ($LASTEXITCODE -ne 0) { throw "Exported Godot smoke failed: $LASTEXITCODE" }

          Get-FileHash (Join-Path $build "CrimeSimSmoke.exe") -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path "ci-artifacts/godot" | Out-Null
          Copy-Item (Join-Path $build "*") "ci-artifacts/godot/" -Recurse -Force

      - name: Compile-check Tauri shell
        run: cargo check --workspace

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build NSIS installer
        run: cargo tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force -Path "ci-artifacts/installer" | Out-Null
          Copy-Item $installer.FullName "ci-artifacts/installer/"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            bridge_version = "0.2.5-bootstrap"
            godot_version = $env:GODOT_VERSION
            installer = $installer.Name
            sha256 = $hash
            godot_smoke = "passed"
          } | ConvertTo-Json | Set-Content "ci-artifacts/installer/release_manifest.json"

      - name: Upload Godot smoke build
        uses: actions/upload-artifact@v4
        with:
          name: CrimeSim-Godot-Smoke
          path: ci-artifacts/godot/**
          if-no-files-found: error

      - name: Upload Windows Bridge installer
        uses: actions/upload-artifact@v4
        with:
          name: CrimeSim-Bridge-Windows-v0.2.5-bootstrap
          path: ci-artifacts/installer/**
          if-no-files-found: error
