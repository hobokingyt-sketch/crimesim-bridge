name: Bootstrap BUILD-1 lock
on:
  push:
    branches: [build/installer-delivery-iv]
    paths: [.github/workflows/bootstrap-build-lock.yml, rust-toolchain.toml]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'hobokingyt-sketch/crimesim-bridge'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Generate missing lock once and commit only that file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path Cargo.lock) { Write-Host 'Lock already exists; no mutation.'; exit 0 }
          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'build: record generated Cargo dependency lock'
          git push origin HEAD:refs/heads/build/installer-delivery-iv
          Write-Host "LOCK_COMMIT=$(git rev-parse HEAD)"
