name: Recovery Safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "armor/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Kill and recover actual coordinator processes
        run: cargo test -p bridge-safety --features fault-injection -- --nocapture
      - name: Check desktop callers use the coordinator
        run: python tools/test_safety_wiring.py
