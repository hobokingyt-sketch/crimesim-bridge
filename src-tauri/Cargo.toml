[package]
name = "crimesim-bridge"
version = "0.2.5"
description = "Transactional chat-to-Godot project bridge"
authors = ["Zeno"]
edition = "2021"
rust-version = "1.89"
default-run = "crimesim-bridge"

[lib]
name = "crimesim_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crimesim-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
bridge-safety = { path = "../crates/bridge-safety" }
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
